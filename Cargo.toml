[package]
name = "spi_sd_card"
description = "A library for using SD cards through SPI"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/ChocolateLoverRaj/spi_sd_card"
authors = ["Rajas Paranjpe"]
license = "AGPL-3.0-or-later"
categories = ["no-std", "embedded", "no-std::no-alloc", "hardware-support"]

[lib]
test = false
bench = false

[dependencies]
arbitrary-int = "2.1.1"
bitbybit = "2.0.0"
bitfield = "0.19.4"
bitflags = "2.10.0"
chrono = { version = "0.4.42", default-features = false, optional = true }
crc = "3.4.0"
defmt = { version = "1.0.1", optional = true }
embassy-embedded-hal = "0.5.0"
embassy-sync = { version = "0.7.2", optional = true }
embassy-time = "0.5.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
heapless = { version = "0.9.2", default-features = false }
num-traits = { version = "0.2.19", optional = true, default-features = false }

[features]
default = []
defmt = ["dep:defmt", "embassy-time/defmt"]
chrono = ["dep:chrono", "dep:num-traits"]
embassy-sync = ["dep:embassy-sync"]

[patch.crates-io]
crc = { git = "https://github.com/mrhooray/crc-rs" }
